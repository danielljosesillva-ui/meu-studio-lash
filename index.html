<!DOCTYPE html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Meu Studio Lash</title>
<link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#C77D91"><link rel="apple-touch-icon" href="icons/icon-192.png"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Meu Studio Lash"><meta name="apple-mobile-web-app-status-bar-style" content="default">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600&family=Poppins:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root{--p:#F8DDE3;--n:#E8D5C4;--bg:#F5EEE8;--card:#FFFFFF;--d:#C77D91;--t:#4a3a3f;--m:#8a767c;--ln:#E8D5C4;--bt:#fff;--ht:#4a3a3f;--nt:#7a5a3a;--h1:#F8DDE3;--h2:#E8D5C4;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
:root[data-tema="nude"]{--p:#EFE0CF;--n:#E3CDB4;--bg:#F7F1EA;--card:#FFFDF9;--d:#A67C52;--t:#43352b;--m:#857465;--ln:#E8D8C6;--bt:#fff;--ht:#43352b;--nt:#6b4a2b;--h1:#EBD9C3;--h2:#D9BE9C}
:root[data-tema="noite"]{--p:#4a3640;--n:#6b5058;--bg:#1e181b;--card:#2b2226;--d:#E3A5B8;--t:#F6E9ED;--m:#BBA4AC;--ln:#43353b;--bt:#2b1a21;--ht:#F6E9ED;--nt:#F6E9ED;--h1:#5a3d49;--h2:#3a2a31}
.th{display:flex;gap:8px;margin-top:6px}.thb{flex:1;background:var(--card);color:var(--t);border:2px solid var(--ln);border-radius:16px;padding:10px 4px;font-size:11px;display:flex;flex-direction:column;align-items:center;gap:6px}.thb.on{border-color:var(--d)}.thb span{width:34px;height:34px;border-radius:50%;border:1px solid var(--ln)}
*{box-sizing:border-box}html,body{margin:0}body{background:var(--bg);color:var(--t);font:400 14px/1.4 Poppins,system-ui,sans-serif;padding-bottom:84px}
h1,h2,h3{font-family:'Playfair Display',Georgia,serif;font-weight:500;margin:0}h1{font-size:26px}h2{font-size:20px;margin:18px 0 8px}
main{max-width:640px;margin:0 auto;padding:16px}small,.m{color:var(--m);font-size:12px}
.card{background:var(--card);border-radius:20px;padding:14px;margin:10px 0;box-shadow:0 2px 12px rgba(199,125,145,.12)}
.hero{background:linear-gradient(135deg,var(--h1),var(--h2));color:var(--ht);border-radius:24px;padding:18px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.grid .card{margin:0}.num{font:600 22px 'Playfair Display',serif;color:var(--d)}
button,.btn{font:500 13px Poppins,sans-serif;border:0;border-radius:999px;padding:10px 16px;background:var(--d);color:var(--bt);cursor:pointer}
button.s{background:var(--p);color:var(--d)}button.g{background:transparent;color:var(--d);border:1px solid var(--d)}button.x{background:transparent;color:#b3475d}
.sc{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}.sc button{background:var(--card);color:var(--d);padding:14px;border-radius:18px;box-shadow:0 2px 10px rgba(199,125,145,.15)}
input,select,textarea{width:100%;font:400 14px Poppins,sans-serif;padding:10px 12px;border:1px solid var(--ln);border-radius:14px;background:var(--card);color:var(--t);margin:3px 0 10px}
label{font-size:12px;color:var(--m)}.row{display:flex;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--ln);cursor:pointer}.row:last-child{border:0}.row>div{flex:1}
.tag{font-size:11px;padding:3px 9px;border-radius:999px;background:var(--p);color:var(--d);white-space:nowrap}.tag.concluido{background:#dcefe2;color:#2f6b45}.tag.cancelado,.tag.faltou{background:#eee;color:#777}.tag.pendente{background:var(--n);color:var(--nt)}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);display:flex;justify-content:space-around;padding:8px 6px calc(8px + env(safe-area-inset-bottom,0px));border-radius:22px 22px 0 0;box-shadow:0 -4px 18px rgba(199,125,145,.18);z-index:5}
nav button{background:none;color:var(--m);display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10px;padding:4px 8px}nav button.on{color:var(--d)}
svg.i{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.bar{display:flex;gap:8px;align-items:center;justify-content:space-between;margin:8px 0}.seg{display:flex;gap:4px}.seg button{padding:6px 12px}
.chips{display:flex;flex-wrap:wrap;gap:6px}.chips button{padding:6px 12px}
.mg{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}.mg div{padding:8px 0;border-radius:12px;font-size:13px}.mg .d{background:var(--card);cursor:pointer}.mg .has{background:var(--p);color:var(--d);font-weight:500}.mg .td{outline:2px solid var(--d)}
.tb{width:100%;border-collapse:collapse}.tb input{margin:0;padding:8px 6px;border-radius:10px;font-size:13px}.tb th{font-size:11px;color:var(--m);font-weight:400;text-align:left;padding:0 2px 4px}.tb td{padding:2px}.mg .mt{box-shadow:inset 0 0 0 2px var(--n)}
#mo{position:fixed;inset:0;background:rgba(60,40,48,.45);display:none;align-items:flex-end;justify-content:center;z-index:9}
#mo>div{background:var(--bg);width:100%;max-width:640px;max-height:92%;overflow:auto;border-radius:24px 24px 0 0;padding:18px}
.ban{background:var(--n);color:var(--nt);border-radius:14px;padding:10px;font-size:12px}
</style></head><body><main id="app"></main><div id="mo" onclick="if(event.target===this)cm()"><div id="mb"></div></div>
<nav id="nav"></nav>
<script>
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])),pad=n=>String(n).padStart(2,'0');
const ymd=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()),pd=s=>{const[a,b,c]=s.split('-');return new Date(+a,b-1,+c)},addD=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x};
const m2=t=>{const[h,m]=t.split(':');return+h*60+ +m},t2=m=>pad(Math.floor(m/60))+':'+pad(m%60),brl=v=>'R$ '+(+v||0).toFixed(2).replace('.',','),uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,5);
const ST={confirmado:'Confirmado',pendente:'Pendente',concluido:'Concluído',cancelado:'Cancelado',faltou:'Não compareceu'},OFF=['cancelado','faltou'],PM=['Dinheiro','Pix','Cartão','Outros'];
const DEF={name:'Meu Studio Lash',owner:'',open:'09:00',close:'18:00',days:[1,2,3,4,5,6],lead:60,maint:15,phone:'',insta:'',svcs:[{n:'Fio a fio',d:150,v:180,m:21},{n:'Volume russo',d:180,v:250,m:21},{n:'Manutenção',d:90,v:120,m:15}]};
const IC={home:'M3 11l9-8 9 8v10H3z',cal:'M4 6h16v14H4zM4 10h16M9 3v4M15 3v4',us:'M16 20v-2a4 4 0 0 0-8 0v2M12 10a3 3 0 1 0 0-6 3 3 0 0 0 0 6',fin:'M12 3v18M16 7h-6a3 3 0 0 0 0 6h4a3 3 0 0 1 0 6H8',cfg:'M12 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6M19 12h2M3 12h2M12 3v2M12 19v2M17 7l1-1M6 18l1-1M17 17l1 1M6 6l1 1'};
const ico=k=>`<svg class="i" viewBox="0 0 24 24"><path d="${IC[k]}"/></svg>`;
let S={clients:[],appts:[],exp:[],cfg:DEF},tab='home',vw='day',cur=new Date(),db=null,base='',st='load',q='';
const cfg=()=>S.cfg,cn=id=>S.clients.find(c=>c.id===id)?.name||'—',live=a=>!OFF.includes(a.status);
const put=(c,o)=>db?db.collection(base+'/'+c).doc(o.id).set(o).catch(e=>alert('Não foi possível salvar: '+(e.message||e.code))):(S[c==='cfg'?'cfg':c]=c==='cfg'?o:[...S[c].filter(x=>x.id!==o.id),o],render());
const del=(c,id)=>{db&&db.collection(base+'/'+c).doc(id).delete();};
const save=()=>{try{localStorage.setItem('msl',JSON.stringify(S))}catch(e){}};
try{const d=JSON.parse(localStorage.getItem('msl')||'null');if(d)S={...S,...d,cfg:{...DEF,...d.cfg}}}catch(e){}
st='ok';try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}
function conflict(a){return S.appts.some(o=>o.id!==a.id&&o.date===a.date&&live(o)&&m2(o.time)<m2(a.time)+a.dur&&m2(a.time)<m2(o.time)+o.dur)}
const rev=(f)=>S.appts.filter(a=>a.paid&&f(a.date)).reduce((s,a)=>s+(+a.val||0),0),exs=f=>S.exp.filter(e=>f(e.date)).reduce((s,e)=>s+(+e.val||0),0);
const wk=d=>{const x=pd(d),s=addD(x,-x.getDay());return ymd(s)},inWeek=(d,ref)=>wk(d)===wk(ref);
function slots(){const c=cfg(),n=new Date(),k=ymd(n);if(!c.days.includes(n.getDay()))return[];const dur=Math.min(...c.svcs.map(s=>+s.d||60),60),o=[];for(let m=m2(c.open);m+dur<=m2(c.close);m+=30){const t=t2(m);if(m<=n.getHours()*60+n.getMinutes())continue;if(!conflict({id:'',date:k,time:t,dur}))o.push(t)}return o}
function mts(){const o=[];S.clients.forEach(c=>{const h=S.appts.filter(a=>a.cid===c.id&&a.status==='concluido').sort((a,b)=>a.date<b.date?1:-1)[0];if(!h||S.appts.some(a=>a.cid===c.id&&live(a)&&a.status!=='concluido'&&a.date>h.date))return;const sv=cfg().svcs.find(x=>x.n===h.svc),d=+(sv&&sv.m)||+cfg().maint||15;o.push({cid:c.id,date:ymd(addD(pd(h.date),d)),svc:h.svc})});return o}
const mAg=(cid,date)=>{const s=cfg().svcs.find(x=>/manuten/i.test(x.n))||cfg().svcs[0]||{n:'Manutenção',d:90,v:0};fA('',{cid,date,svc:s.n,dur:s.d,val:s.v})};
const mRow=m=>`<div class="row" onclick="mAg('${m.cid}','${m.date}')"><b>✿</b><div>${esc(cn(m.cid))}<br><small>Manutenção prevista · toque para agendar</small></div><span class="tag pendente">Manutenção</span></div>`;
function notes(){const n=new Date(),k=ymd(n),nm=n.getHours()*60+n.getMinutes(),L=[],lead=+cfg().lead;
 S.appts.filter(a=>live(a)&&a.status!=='concluido'&&a.date===k).sort((a,b)=>a.time<b.time?-1:1).forEach(a=>{const d=m2(a.time)-nm;if(d>=0&&d<=lead)L.push(['⏰','Em '+d+' min: '+cn(a.cid)+' ('+a.time+')'])});
 S.appts.filter(a=>a.status==='confirmado'&&(a.date===k||a.date===ymd(addD(n,1)))).forEach(a=>L.push(['✔','Confirmado: '+cn(a.cid)+' · '+(a.date===k?'hoje':'amanhã')+' '+a.time]));
 S.appts.filter(a=>a.status==='cancelado'&&a.date>=k).forEach(a=>L.push(['✖','Cancelado: '+cn(a.cid)+' · '+pd(a.date).toLocaleDateString('pt-BR')]));
 S.appts.filter(a=>a.status==='concluido'&&!a.paid).forEach(a=>L.push(['$','Pagamento pendente: '+cn(a.cid)+' · '+brl(a.val)]));
 mts().filter(m=>m.date<=ymd(addD(n,3))).sort((a,b)=>a.date<b.date?-1:1).forEach(m=>L.push(['✿','Manutenção: '+cn(m.cid)+' · '+(m.date<k?'atrasada desde ':'')+pd(m.date).toLocaleDateString('pt-BR')]));const bd=bkInfo();if((S.clients.length||S.appts.length)&&(!bd||Math.round((n-pd(bd))/864e5)>=7))L.push(['⬇','Faça o backup dos seus dados (botão Backup aqui no Início)']);return L}
function render(){save();const c=cfg();document.title=c.name;applyT();$('#nav').innerHTML=[['home','Início'],['cal','Agenda'],['us','Clientes'],['fin','Financeiro'],['cfg','Ajustes']].map(([k,l])=>`<button class="${(tab==={home:'home',cal:'cal',us:'cli',fin:'fin',cfg:'cfg'}[k])?'on':''}" onclick="go('${{home:'home',cal:'cal',us:'cli',fin:'fin',cfg:'cfg'}[k]}')">${ico(k)}${l}</button>`).join('');
 const ban=st==='off'?'<div class="ban">Você não está conectada: os dados não serão salvos. Abra pelo Claude para ativar o salvamento.</div>':st==='load'?'<div class="ban">Carregando…</div>':'';
 $('#app').innerHTML=ban+({home:vHome,cal:vCal,cli:vCli,fin:vFin,cfg:vCfg}[tab])()}
const TH={rose:['Rosé clássico','#F8DDE3','#C77D91'],nude:['Nude dourado','#EFE0CF','#A67C52'],noite:['Noite rosé','#2b2226','#E3A5B8']};
const applyT=()=>{const t=cfg().theme in TH?cfg().theme:'rose';document.documentElement.dataset.tema=t;const m=document.querySelector('meta[name=theme-color]');if(m)m.content={rose:'#C77D91',nude:'#A67C52',noite:'#1e181b'}[t]};
const setT=k=>put('cfg',{...cfg(),id:'main',theme:k});
const go=t=>{tab=t;render();scrollTo(0,0)};
function vHome(){const c=cfg(),n=new Date(),k=ymd(n),h=n.getHours(),g=h<12?'Bom dia':h<18?'Boa tarde':'Boa noite',td=S.appts.filter(a=>a.date===k&&live(a)),nx=S.appts.filter(a=>live(a)&&a.status!=='concluido'&&(a.date+a.time)>=(k+pad(h)+':'+pad(n.getMinutes()))).sort((a,b)=>(a.date+a.time<b.date+b.time)?-1:1)[0],sl=slots(),nt=notes();
 return`<div class="hero"><small>${esc(c.name)}</small><h1>${g}, ${esc(c.owner||'linda')}</h1><div>${n.toLocaleDateString('pt-BR',{weekday:'long',day:'numeric',month:'long'})}</div></div>
<div class="grid" style="margin-top:12px"><div class="card"><small>Atendimentos hoje</small><div class="num">${td.length}</div></div><div class="card"><small>Faturamento hoje</small><div class="num">${brl(rev(d=>d===k))}</div></div><div class="card"><small>Clientes</small><div class="num">${S.clients.length}</div></div><div class="card"><small>Próximo</small><div style="font-weight:500">${nx?esc(cn(nx.cid))+'<br><small>'+(nx.date===k?'hoje':pd(nx.date).toLocaleDateString('pt-BR'))+' às '+nx.time+'</small>':'<small>Nenhum</small>'}</div></div></div>
<div class="sc"><button onclick="fA()">+ Nova reserva</button><button onclick="fC()">+ Cadastrar cliente</button><button onclick="go('fin')">Financeiro</button><button onclick="go('cal')">Ver agenda</button></div>
<h2>Horários livres hoje</h2><div class="card chips">${sl.length?sl.slice(0,12).map(t=>`<button class="s" onclick="fA('',{time:'${t}'})">${t}</button>`).join(''):'<small>Sem horários livres hoje.</small>'}</div>
<div class="card" style="display:flex;gap:10px;align-items:center;justify-content:space-between"><div><b>Backup</b><br><small>${bkTxt()}</small></div><button onclick="exB()">Fazer backup</button></div><h2>Notificações</h2><div class="card">${nt.length?nt.map(([i,t])=>`<div class="row" style="cursor:default"><span>${i}</span><div>${esc(t)}</div></div>`).join(''):'<small>Tudo em dia ✿</small>'}</div>`}
function aRow(a,d){return`<div class="row" onclick="fA('${a.id}')"><b>${d?pd(a.date).toLocaleDateString('pt-BR',{day:'2-digit',month:'2-digit'})+' ':''}${a.time}</b><div>${esc(cn(a.cid))}<br><small>${esc(a.svc)} · ${+(a.dur/60).toFixed(2)}h · ${brl(a.val)}${a.paid?' · pago':''}</small></div><span class="tag ${a.status}">${ST[a.status]}</span></div>`}
function vCal(){const d=cur,L={day:d.toLocaleDateString('pt-BR',{weekday:'long',day:'numeric',month:'long'}),week:'Semana de '+pd(wk(ymd(d))).toLocaleDateString('pt-BR',{day:'2-digit',month:'short'}),month:d.toLocaleDateString('pt-BR',{month:'long',year:'numeric'})}[vw];
 let b='';const MT=mts(),by=k=>S.appts.filter(a=>a.date===k).sort((a,b)=>a.time<b.time?-1:1);
 if(vw==='day'){const k0=ymd(d),l=by(k0),mm=MT.filter(m=>m.date===k0);b=`<div class="card">${l.length||mm.length?l.map(a=>aRow(a)).join('')+mm.map(mRow).join(''):'<small>Sem agendamentos neste dia.</small>'}</div>`}
 else if(vw==='week'){const s=pd(wk(ymd(d)));for(let i=0;i<7;i++){const x=addD(s,i),l=by(ymd(x)),mm=MT.filter(m=>m.date===ymd(x));b+=`<div class="card"><b>${x.toLocaleDateString('pt-BR',{weekday:'short',day:'2-digit'})}</b>${l.length||mm.length?l.map(a=>aRow(a)).join('')+mm.map(mRow).join(''):'<br><small>Livre</small>'}</div>`}}
 else{const f=new Date(d.getFullYear(),d.getMonth(),1),nd=new Date(d.getFullYear(),d.getMonth()+1,0).getDate();b='<div class="card"><div class="mg">'+'DSTQQSS'.split('').map(x=>`<small>${x}</small>`).join('')+'<div></div>'.repeat(f.getDay());for(let i=1;i<=nd;i++){const k=d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(i),n=S.appts.filter(a=>a.date===k&&live(a)).length,mt=MT.some(m=>m.date===k);b+=`<div class="d ${n?'has':''} ${mt?'mt':''} ${k===ymd(new Date())?'td':''}" onclick="cur=pd('${k}');vw='day';render()">${i}${n?'<br><small>'+n+'</small>':''}${mt&&!n?'<br><small>✿</small>':''}</div>`}b+='</div></div>'}
 return`<h1>Agenda</h1><div class="bar"><div class="seg">${[['day','Dia'],['week','Semana'],['month','Mês']].map(([k,l])=>`<button class="${vw===k?'':'s'}" onclick="vw='${k}';render()">${l}</button>`).join('')}</div><button onclick="fA('',{date:'${ymd(cur)}'})">+ Novo</button></div>
<div class="bar"><button class="s" onclick="nav(-1)">‹</button><b style="text-transform:capitalize;text-align:center">${L}</b><button class="s" onclick="nav(1)">›</button></div>${b}`}
const nav=n=>{cur=vw==='month'?new Date(cur.getFullYear(),cur.getMonth()+n,1):addD(cur,n*(vw==='week'?7:1));render()};
function fA(id,pre={}){const c=cfg(),a=S.appts.find(x=>x.id===id)||{id:'',cid:'',svc:c.svcs[0]?.n||'',date:ymd(cur),time:'09:00',dur:c.svcs[0]?.d||60,val:c.svcs[0]?.v||0,status:'confirmado',paid:false,method:'Pix',notes:'',...pre};
 
 om(`<h2>${id?'Editar':'Nova'} reserva</h2><label>Cliente</label><select id="a1" onchange="nc.style.display=this.value==='__new'?'block':'none'">${S.clients.map(x=>`<option value="${x.id}" ${x.id===a.cid?'selected':''}>${esc(x.name)}</option>`).join('')}${id?'':`<option value="__new" ${S.clients.length?'':'selected'}>+ Nova cliente</option>`}</select><div id="nc" style="display:${S.clients.length||id?'none':'block'}"><input id="n1" placeholder="Nome da cliente"><input id="n2" type="tel" placeholder="Telefone"></div>
<label>Procedimento</label><select id="a2" onchange="const s=cfg().svcs.find(x=>x.n===this.value);if(s){a4.value=+(s.d/60).toFixed(2);a5.value=s.v}">${c.svcs.map(s=>`<option ${s.n===a.svc?'selected':''}>${esc(s.n)}</option>`).join('')}${c.svcs.some(s=>s.n===a.svc)?'':`<option selected>${esc(a.svc)}</option>`}</select>
<div class="grid"><div><label>Data</label><input id="a3" type="date" value="${a.date}"></div><div><label>Horário</label><input id="a6" type="time" value="${a.time}"></div><div><label>Duração (horas)</label><input id="a4" type="number" step="0.25" value="${+(a.dur/60).toFixed(2)}"></div><div><label>Valor (R$)</label><input id="a5" type="number" step="0.01" value="${a.val}"></div></div>
<label>Status</label><select id="a7">${Object.entries(ST).map(([k,v])=>`<option value="${k}" ${k===a.status?'selected':''}>${v}</option>`).join('')}</select>
<div class="grid"><div><label>Pagamento</label><select id="a8"><option value="0">Não pago</option><option value="1" ${a.paid?'selected':''}>Pago</option></select></div><div><label>Forma</label><select id="a9">${PM.map(p=>`<option ${p===a.method?'selected':''}>${p}</option>`).join('')}</select></div></div>
<label>Observações</label><textarea id="a10" rows="2">${esc(a.notes)}</textarea><div class="bar"><button onclick="sA('${id}')">Salvar</button>${id?`<button class="g" onclick="xA('${id}')">Cancelar reserva</button><button class="x" onclick="dA('${id}')">Excluir</button>`:'<button class="s" onclick="cm()">Fechar</button>'}</div>`)}
function sA(id){const pv=S.appts.find(x=>x.id===id);let cid=a1.value;const nw=cid==='__new';if(nw){if(!n1.value.trim())return alert('Informe o nome da cliente.');cid=uid()}const o={id:id||uid(),cid,svc:a2.value,date:a3.value,time:a6.value,dur:Math.round((+a4.value||0.5)*60),val:+a5.value||0,status:a7.value,paid:a8.value==='1',method:a9.value,notes:a10.value};
 if(!o.date||!o.time)return alert('Informe data e horário.');if(live(o)&&conflict(o))return alert('Conflito de horário com outro agendamento.');if(nw)put('clients',{id:cid,name:n1.value.trim(),phone:n2.value,birth:'',prefs:'',notes:''});put('appts',o);cm();if(o.status==='concluido'&&(!pv||pv.status!=='concluido')){const sv=cfg().svcs.find(x=>x.n===o.svc),dd=+(sv&&sv.m)||+cfg().maint||15;setTimeout(()=>alert('Atendimento concluído! Manutenção prevista para '+addD(pd(o.date),dd).toLocaleDateString('pt-BR')+' (já marcada na agenda).'),50)}}
const xA=id=>{const a=S.appts.find(x=>x.id===id);put('appts',{...a,status:'cancelado'});cm()},dA=id=>{if(confirm('Excluir definitivamente?')){del('appts',id);if(!db)S.appts=S.appts.filter(x=>x.id!==id);cm();render()}};
function vCli(){const l=S.clients.filter(c=>(c.name+c.phone).toLowerCase().includes(q.toLowerCase())).sort((a,b)=>a.name.localeCompare(b.name));
 return`<h1>Clientes</h1><div class="bar"><input style="margin:0" placeholder="Pesquisar…" value="${esc(q)}" oninput="q=this.value;render();this.focus()"><button onclick="fC()">+</button></div><div class="card">${l.length?l.map(c=>`<div class="row" onclick="fC('${c.id}')"><div>${esc(c.name)}<br><small>${esc(c.phone)}</small></div><small>${S.appts.filter(a=>a.cid===c.id&&a.status==='concluido').length} atend.</small></div>`).join(''):'<small>Nenhuma cliente encontrada.</small>'}</div>`}

<div class="bar"><button onclick="sC('${id||''}')">Salvar</button>${id?`<button class="s" onclick="cm();fA('',{cid:'${id}'})">Reservar</button><button class="x" onclick="dC('${id}')">Excluir</button>`:''}</div>${id?`<h3>Histórico</h3><div class="card">${h.length?h.map(a=>aRow(a,1)).join(''):'<small>Sem atendimentos.</small>'}</div>`:''}`)}

const dC=id=>{if(confirm('Excluir cliente?')){del('clients',id);if(!db)S.clients=S.clients.filter(x=>x.id!==id);cm();render()}};
function vFin(){const k=ymd(new Date()),n=new Date(),mo=d=>d.slice(0,7)===k.slice(0,7),pend=S.appts.filter(a=>live(a)&&!a.paid&&(a.status==='concluido')),pv=pend.reduce((s,a)=>s+(+a.val||0),0),rm=rev(mo),em=exs(mo),M=[];
 for(let i=5;i>=0;i--){const d=new Date(n.getFullYear(),n.getMonth()-i,1),p=d.getFullYear()+'-'+pad(d.getMonth()+1);M.push([d.toLocaleDateString('pt-BR',{month:'short'}),rev(x=>x.slice(0,7)===p),exs(x=>x.slice(0,7)===p)])}
 const mx=Math.max(1,...M.flatMap(x=>[x[1],x[2]])),bars=M.map((x,i)=>{const w=44*i+10,h1=x[1]/mx*90,h2=x[2]/mx*90;return`<rect x="${w}" y="${100-h1}" width="14" height="${h1}" rx="4" style="fill:var(--d)"/><rect x="${w+16}" y="${100-h2}" width="14" height="${h2}" rx="4" style="fill:var(--n)"/><text x="${w+6}" y="116" font-size="10" fill="currentColor" opacity=".6">${x[0]}</text>`}).join('');
 return`<h1>Financeiro</h1><div class="grid" style="margin-top:10px"><div class="card"><small>Hoje</small><div class="num">${brl(rev(d=>d===k))}</div></div><div class="card"><small>Semana</small><div class="num">${brl(rev(d=>inWeek(d,k)))}</div></div><div class="card"><small>Mês</small><div class="num">${brl(rm)}</div></div><div class="card"><small>Despesas (mês)</small><div class="num">${brl(em)}</div></div><div class="card"><small>Lucro estimado</small><div class="num">${brl(rm-em)}</div></div><div class="card"><small>Pendentes</small><div class="num">${brl(pv)}</div></div></div>
<h2>Receitas × despesas</h2><div class="card"><svg viewBox="0 0 270 122" width="100%"><g>${bars}</g></svg><small><span style="color:var(--d)">■</span> Receitas &nbsp;<span style="color:var(--n)">■</span> Despesas</small></div>
<h2>Pagamentos pendentes</h2><div class="card">${pend.length?pend.map(a=>`<div class="row" onclick="fP('${a.id}')"><div>${esc(cn(a.cid))}<br><small>${pd(a.date).toLocaleDateString('pt-BR')} · ${esc(a.svc)}</small></div><b>${brl(a.val)}</b></div>`).join(''):'<small>Nenhum pagamento pendente.</small>'}</div>
<div class="bar"><h2 style="margin:0">Despesas</h2><button onclick="fE()">+ Despesa</button></div><div class="card">${S.exp.length?[...S.exp].sort((a,b)=>a.date<b.date?1:-1).slice(0,15).map(e=>`<div class="row" onclick="if(confirm('Excluir despesa?')){del('exp','${e.id}');if(!db){S.exp=S.exp.filter(x=>x.id!=='${e.id}')}render()}"><div>${esc(e.desc)}<br><small>${pd(e.date).toLocaleDateString('pt-BR')}</small></div><b>${brl(e.val)}</b></div>`).join(''):'<small>Sem despesas.</small>'}</div>`}
const fP=id=>om(`<h2>Registrar pagamento</h2><p class="m">Forma de pagamento:</p><div class="chips">${PM.map(p=>`<button onclick="pay('${id}','${p}')">${p}</button>`).join('')}</div>`),pay=(id,p)=>{put('appts',{...S.appts.find(a=>a.id===id),paid:true,method:p});cm()};
const fE=()=>om(`<h2>Nova despesa</h2><label>Descrição</label><input id="e1"><label>Valor (R$)</label><input id="e2" type="number" step="0.01"><label>Data</label><input id="e3" type="date" value="${ymd(new Date())}"><button onclick="if(!e1.value||!e2.value)return alert('Preencha descrição e valor.');put('exp',{id:uid(),desc:e1.value,val:+e2.value,date:e3.value});cm()">Salvar</button>`);

function vCfg(){const c=cfg();return`<h1>Ajustes</h1><div class="card"><label>Tema visual</label><div class="th">${Object.entries(TH).map(([k,v])=>`<button class="thb ${(cfg().theme||'rose')===k?'on':''}" onclick="setT('${k}')"><span style="background:linear-gradient(135deg,${v[1]} 50%,${v[2]} 50%)"></span>${v[0]}</button>`).join('')}</div></div><div class="card"><label>Seu nome</label><input id="s0" value="${esc(c.owner)}"><label>Nome do Studio</label><input id="s1" value="${esc(c.name)}">
<div class="grid"><div><label>Abre às</label><input id="s2" type="time" value="${c.open}"></div><div><label>Fecha às</label><input id="s3" type="time" value="${c.close}"></div></div>
<label>Dias de atendimento</label><div class="chips" style="margin-bottom:10px">${'DSTQQSS'.split('').map((l,i)=>`<label><input type="checkbox" class="dy" value="${i}" style="width:auto;margin:0 4px 0 0" ${c.days.includes(i)?'checked':''}>${['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'][i]}</label>`).join('')}</div>
<label>Procedimentos</label><table class="tb"><thead><tr><th>Nome</th><th>Tempo<br>Horas</th><th>R$</th><th>Manut. (dias)</th><th></th></tr></thead><tbody id="tb">${c.svcs.map(rowS).join('')}</tbody></table><button class="s" style="margin:8px 0 12px" onclick="tb.insertAdjacentHTML('beforeend',rowS({}))">+ Procedimento</button>
<div class="grid"><div><label>Lembrete (min antes)</label><select id="s5">${[30,60,120,1440].map(v=>`<option value="${v}" ${+c.lead===v?'selected':''}>${v>=1440?'1 dia':v+' min'}</option>`).join('')}</select></div><div><label>Manutenção padrão (dias)</label><input id="s6" type="number" value="${c.maint}"></div></div>
<label>Telefone / WhatsApp</label><input id="s7" value="${esc(c.phone)}"><label>Instagram</label><input id="s8" value="${esc(c.insta)}"><button onclick="sS()">Salvar ajustes</button></div><h2>Backup dos dados</h2><div class="card"><p class="m">Seus dados ficam só neste aparelho. Exporte um backup de vez em quando e use Importar para restaurar ou trocar de celular.</p><div class="bar"><button class="s" onclick="exB()">Exportar</button><button class="s" onclick="imB()">Importar</button></div></div>`}
function sS(){const svcs=[...document.querySelectorAll('#tb tr')].map(r=>({n:r.querySelector('.sn').value.trim(),d:Math.round((+r.querySelector('.sd').value||1)*60),v:+r.querySelector('.sv').value||0,m:+r.querySelector('.sm').value||0})).filter(x=>x.n);
 put('cfg',{id:'main',theme:cfg().theme||'rose',owner:s0.value,name:s1.value||'Meu Studio Lash',open:s2.value,close:s3.value,days:[...document.querySelectorAll('.dy:checked')].map(x=>+x.value),svcs:svcs.length?svcs:DEF.svcs,lead:+s5.value,maint:+s6.value||15,phone:s7.value,insta:s8.value});alert('Ajustes salvos ✿')}
const bkInfo=()=>{try{return localStorage.getItem('msl_bk')}catch(e){return null}};
const bkTxt=()=>{const d=bkInfo();if(!d)return'Você ainda não fez backup.';const n=Math.round((new Date()-pd(d))/864e5);return'Último: '+pd(d).toLocaleDateString('pt-BR')+(n>0?' (há '+n+' dias)':' (hoje)')};
const exB=async()=>{const nm='backup-meu-studio-lash-'+ymd(new Date())+'.json',blob=new Blob([JSON.stringify(S)],{type:'application/json'}),f=new File([blob],nm,{type:'application/json'});let ok=true;
 try{if(navigator.canShare&&navigator.canShare({files:[f]}))await navigator.share({files:[f],title:'Backup Meu Studio Lash'});else{const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=nm;a.click()}}catch(e){ok=false}
 if(ok){try{localStorage.setItem('msl_bk',ymd(new Date()))}catch(e){}render()}};
const imB=()=>{const i=document.createElement('input');i.type='file';i.accept='.json,application/json';i.onchange=()=>{const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);if(!d.clients||!d.appts)throw 0;if(!confirm('Substituir os dados atuais pelo backup?'))return;S={clients:d.clients,appts:d.appts,exp:d.exp||[],cfg:{...DEF,...d.cfg}};render();alert('Backup restaurado ✿')}catch(e){alert('Arquivo de backup inválido.')}};r.readAsText(i.files[0])};i.click()};
const om=h=>{$('#mb').innerHTML=h;$('#mo').style.display='flex'},cm=()=>{$('#mo').style.display='none'};
render();
